{% extends "base.html" %}

{% block title %}Edit Project - HiLancer{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="p-4 p-md-5 hilancer-card shadow-lg">
                <h3 class="fw-bold mb-3"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Project Details</h3>

                <form action="{{ url_for('client.edit_project', job_id=job.id) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Project Title</label>
                        <input type="text" name="title" class="form-control rounded-3" value="{{ job.title }}" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Category</label>
                            <input type="text" name="category" class="form-control rounded-3" value="{{ job.category }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Budget Range / Rate</label>
                            <input type="text" name="salary" class="form-control rounded-3" value="{{ job.salary }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Required Skills (Comma Separated)</label>
                        <input type="text" name="skills" class="form-control rounded-3" value="{{ job.skills }}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Detailed Project Description</label>
                        <textarea name="description" class="form-control rounded-3" rows="6" required>{{ job.description }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('client.dashboard') }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary-gradient rounded-pill px-5 shadow-sm">Update Project</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
